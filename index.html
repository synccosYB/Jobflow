<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobFlow · prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:16px/1.45 -apple-system,Segoe UI,Inter,Roboto,sans-serif;color:#17202a;background:#f6f7f9;display:flex;overflow:hidden}
a{color:inherit;text-decoration:none}
nav{width:220px;background:#fff;border-right:1px solid #e6e8ec;padding:18px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.brand{font-weight:800;font-size:20px;padding:4px 10px 16px}.brand b{color:#2563eb}
nav a{padding:10px 12px;border-radius:10px;font-weight:600;color:#4b5563;display:flex;justify-content:space-between}
nav a.on,nav a:hover{background:#eef3ff;color:#2563eb}
.cnt{background:#dc2626;color:#fff;border-radius:99px;font-size:12px;padding:0 8px;line-height:20px}
main{flex:1;overflow-y:auto;padding:26px 34px}
.cap{color:#6b7280;font-size:14px;margin:2px 0 18px}
h1{font-size:28px;margin:0}h2{font-size:18px;margin:22px 0 10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:16px}
.big{font-size:30px;font-weight:800}.muted{color:#6b7280;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid #e6e8ec;border-radius:12px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}.row .t{font-weight:700}
.red{border-left:5px solid #dc2626}.amb{border-left:5px solid #f59e0b}.grn{border-left:5px solid #16a34a}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef0f3;white-space:nowrap}
.tag.r{background:#fee2e2;color:#b91c1c}.tag.a{background:#fef3c7;color:#92400e}.tag.g{background:#dcfce7;color:#166534}.tag.b{background:#dbeafe;color:#1d4ed8}
.btn{border:0;background:#2563eb;color:#fff;font-weight:700;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;white-space:nowrap}
.btn.l{background:#eef3ff;color:#2563eb}.btn.s{padding:6px 12px;font-size:13px}
.steps{display:flex;gap:3px;margin-top:6px}.steps i{flex:1;height:7px;border-radius:4px;background:#e5e7eb}.steps i.d{background:#2563eb}.steps i.c{background:#93c5fd}
.phases{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.ph{flex:1;min-width:110px;padding:10px;border-radius:10px;background:#fff;border:1px solid #e6e8ec;font-size:13px}
.ph.d{background:#eef3ff;border-color:#bfd3ff}.ph.c{background:#2563eb;color:#fff}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.tabs a{padding:8px 14px;border-radius:99px;background:#fff;border:1px solid #e6e8ec;font-weight:600;font-size:14px;cursor:pointer}.tabs a.on{background:#17202a;color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e6e8ec}td,th{padding:11px 14px;text-align:left;border-bottom:1px solid #eef0f3;font-size:15px}th{font-size:13px;color:#6b7280}
.who{display:inline-flex;align-items:center;gap:6px}.av{width:26px;height:26px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.alert{background:#fff7ed;border:1px solid #fdba74;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:14px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:22px;width:780px;max-width:100%;max-height:90vh;overflow:auto}
select,textarea,input{width:100%;font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px}
.log{font-size:14px;border-left:2px solid #e5e7eb;padding-left:12px;margin-left:6px}.log div{margin-bottom:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:10}
.mob{display:none}
@media(max-width:820px){body{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid #e6e8ec;flex-shrink:0}.brand{display:none}nav a{white-space:nowrap;padding:8px 10px}main{padding:16px}.g2,.g3,.g4{grid-template-columns:1fr 1fr}h1{font-size:22px}.hide-m{display:none}table{font-size:14px;display:block;overflow-x:auto;white-space:nowrap}td,th{padding:8px}.alert{flex-direction:column;align-items:flex-start}}
</style></head><body>
<nav id="nav"></nav><main id="m"></main>
<div class="modal" id="md"><div class="mbox" id="mb"></div></div><div class="toast" id="ts"></div>
<script>
const P=[
{id:'p1',name:'Goldberg Residence — Full Renovation',client:'Goldberg Family',addr:'14 Forest Rd, Monroe NY',owner:'Moshe K.',phase:3,quiet:0,
 jobs:[
 {n:'Kitchen plumbing rough-in',est:{lab:6800,mat:3200,sub:0},act:{lab:5900,mat:3450,sub:0},inv:10500,paid:10500,trade:'Plumbing',step:6,who:'Avi (Plumbing crew)',due:'Nov 12',st:'ok'},
 {n:'Add powder room (client request)',est:{lab:4200,mat:3900,sub:1700},act:{lab:0,mat:0,sub:0},inv:0,paid:0,trade:'Plumbing',step:3,who:'Unassigned',due:'Nov 14',st:'unassigned'},
 {n:'Second-floor framing',est:{lab:14500,mat:11800,sub:0},act:{lab:9800,mat:12600,sub:0},inv:18000,paid:18000,trade:'Framing',step:5,who:'Yossi (Framing crew)',due:'Nov 10',st:'blocked',why:'Waiting on framing inspection'},
 {n:'Window upgrade change order',est:{lab:1800,mat:4400,sub:0},act:{lab:0,mat:0,sub:0},inv:0,paid:0,trade:'Windows',step:4,who:'Sara (Office)',due:'Nov 8',st:'overdue'}]},
{id:'p2',name:'Weiss Building — Roof Replacement',client:'Weiss Properties',addr:'220 Main St, Kiryas Joel NY',owner:'Moshe K.',phase:4,quiet:0,
 jobs:[{n:'Tear-off & deck repair',est:{lab:9500,mat:4200,sub:0},act:{lab:10200,mat:4100,sub:0},inv:16500,paid:16500,trade:'Roofing',step:7,who:'Roof crew B',due:'Nov 6',st:'done'},
 {n:'Install membrane',est:{lab:8800,mat:13400,sub:0},act:{lab:2100,mat:6900,sub:0},inv:12000,paid:12000,trade:'Roofing',step:5,who:'Roof crew B',due:'Nov 13',st:'blocked',why:'Material on backorder'},
 {n:'Gutter add-on (client request)',est:{lab:900,mat:1100,sub:0},act:{lab:0,mat:0,sub:0},inv:0,paid:0,trade:'Roofing',step:2,who:'Sara (Office)',due:'Nov 15',st:'ok'}]},
{id:'p3',name:'Klein Duplex — New Build',client:'Klein Dev LLC',addr:'8 Satmar Dr, Monroe NY',owner:'Chaim R.',phase:1,quiet:23,
 jobs:[{n:'Architect plan revision v3',est:{lab:0,mat:0,sub:3500},act:{lab:0,mat:0,sub:2800},inv:4000,paid:4000,trade:'Architect',step:3,who:'Rivky (Architect)',due:'Oct 28',st:'overdue'},
 {n:'Civil site plan',est:{lab:0,mat:0,sub:6200},act:{lab:0,mat:0,sub:1500},inv:2000,paid:2000,trade:'Civil Eng.',step:2,who:'Dov (Engineer)',due:'Nov 20',st:'ok'}]}];
const MATS={'Kitchen plumbing rough-in':[['PEX 1/2" ×500ft','ABC Supply',1,'$640','Delivered'],['Fittings kit','Ferguson',1,'$410','Delivered'],['Water heater 50gal','Ferguson',1,'$2,400','Delivered']],
'Second-floor framing':[['2×10 joists ×120','Monroe Lumber',120,'$6,900','Delivered'],['Plywood 3/4" ×80','Monroe Lumber',80,'$4,700','Delivered'],['Hangers & fasteners','Home Depot Pro',1,'$1,000','Delivered']],
'Install membrane':[['TPO membrane 60mil','Beacon Roofing',14,'$9,800','Backorder'],['Insulation board','Beacon Roofing',40,'$3,600','Delivered']],
'Window upgrade change order':[['Andersen 400 windows ×9','ABC Supply',9,'$4,400','Backorder']],
'Add powder room (client request)':[['Toilet + vanity set','Ferguson',1,'$1,900','To order'],['Tile & setting','Tile Depot',1,'$2,000','To order']]};
const $$=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString();
const sum=o=>o.lab+o.mat+o.sub;

const COSTS={};
const SEED={
'Kitchen plumbing rough-in':[['Nov 2','lab','Plumber hours – Avi','32 h',95,'In-house','Avi'],['Nov 3','lab','Helper hours','20 h',143,'In-house','Avi'],['Nov 2','mat','PEX 1/2" ×500ft','1',640,'ABC Supply','Avi'],['Nov 2','mat','Fittings kit','1',410,'Ferguson','Avi'],['Nov 4','mat','Water heater 50 gal','1',2400,'Ferguson','Sara']],
'Second-floor framing':[['Nov 1','lab','Framing crew – 4 men','4 days',2450,'In-house','Yossi'],['Nov 1','mat','2×10 joists','120',57.5,'Monroe Lumber','Yossi'],['Nov 1','mat','Plywood 3/4"','80',58.75,'Monroe Lumber','Yossi'],['Nov 5','mat','Hangers & fasteners','1',1000,'Home Depot Pro','Yossi']],
'Tear-off & deck repair':[['Oct 28','lab','Roof crew B','3 days',3400,'In-house','Chaim'],['Oct 28','mat','Deck plywood','40',62.5,'Beacon Roofing','Chaim'],['Oct 29','mat','Dumpster 30yd','1',1600,'Orange County Waste','Sara']],
'Install membrane':[['Nov 6','lab','Roof crew B','1 day',2100,'In-house','Chaim'],['Nov 6','mat','Insulation board','40',90,'Beacon Roofing','Chaim'],['Nov 6','mat','TPO membrane (partial)','5',660,'Beacon Roofing','Chaim']],
'Architect plan revision v3':[['Oct 20','sub','Rivky Design – revision v3','1',2800,'Rivky Design LLC','Moshe K.']],
'Civil site plan':[['Nov 4','sub','Survey + site plan deposit','1',1500,'Dov Engineering','Chaim R.']]};
const TN={lab:'Labor',mat:'Materials',sub:'Sub'};
function syncAct(j){const L=COSTS[j.n]||[];j.act={lab:0,mat:0,sub:0};L.forEach(c=>j.act[c.t]+=c.amt)}
const STEPS=['Request','Details','Estimate','Approval','Deposit','Schedule','Handoff','Done'];
const PHASES=['Design','Permits','Foundation','Trades','Inspections','Closeout','Warranty'];
const HIST={};let TAB='jobs';
const $=s=>document.getElementById(s);
function toast(t){$('ts').textContent=t;$('ts').style.display='block';setTimeout(()=>$('ts').style.display='none',2200)}
function av(n){return `<span class="who"><span class="av">${n.split(' ').map(x=>x[0]).join('').slice(0,2)}</span>${n}</span>`}
function stTag(j){return {ok:'<span class="tag g">On track</span>',done:'<span class="tag b">Done</span>',blocked:'<span class="tag r">Blocked</span>',overdue:'<span class="tag r">Overdue</span>',unassigned:'<span class="tag a">Unassigned</span>'}[j.st]}
function bar(s){return `<div class="steps">${STEPS.map((x,i)=>`<i class="${i<s?'d':i==s?'c':''}" title="${x}"></i>`).join('')}</div><div class="muted" style="font-size:12px;margin-top:3px">Step ${Math.min(s+1,8)} of 8: <b>${STEPS[Math.min(s,7)]}</b></div>`}
function attn(){let a=[];P.forEach(p=>{p.jobs.forEach((j,k)=>{if(['blocked','overdue','unassigned'].includes(j.st))a.push({p,j,k})});if(p.quiet>14)a.push({p,quiet:1})});return a}
function nav(cur){const n=attn().length;$('nav').innerHTML=`<div class="brand">Job<b>Flow</b></div>`+[['dash','Needs attention',n],['projects','Projects'],['mine','My tasks'],['crews','Crew schedule'],['vault','Vault'],['clients','Clients'],['crew','Crew phone view']].map(([h,t,c])=>`<a href="#${h}" class="${cur==h?'on':''}">${t}${c?`<span class="cnt">${c}</span>`:''}</a>`).join('')}
const V={
dash(){const a=attn();return `<h1>Needs attention</h1><div class="cap">Everything stuck, late or unowned rises here in red, so nothing falls through the cracks.</div>
<div class="grid g4"><div class="card"><div class="big">${P.length}</div><div class="muted">Active projects</div></div><div class="card"><div class="big" style="color:#dc2626">${a.length}</div><div class="muted">Need attention</div></div><div class="card"><div class="big">${P.reduce((s,p)=>s+p.jobs.filter(j=>j.st!='done').length,0)}</div><div class="muted">Open jobs</div></div><div class="card"><div class="big">4</div><div class="muted">Crews out today</div></div></div>
<h2>Fix these first</h2>${a.map(x=>x.quiet?`<div class="row red"><div class="grow"><div class="t">${x.p.name}</div><div class="muted">No activity for ${x.p.quiet} days · Owner ${x.p.owner}</div></div><span class="tag r">Gone quiet</span><a class="btn s l" href="#p/${x.p.id}">Open</a></div>`:
`<div class="row red"><div class="grow"><div class="t">${x.j.n}</div><div class="muted">${x.p.name} · ${x.j.why||('Due '+x.j.due)} · Assignee ${x.j.who}</div></div>${stTag(x.j)}<a class="btn s l" href="#p/${x.p.id}">Open</a></div>`).join('')}`},
projects(){return `<h1>Projects</h1><div class="cap">Each big project holds many small jobs. Every small job runs the same simple 8-step flow.</div>
<div class="grid g3">${P.map(p=>`<a class="card" href="#p/${p.id}"><div class="t" style="font-weight:800">${p.name}</div><div class="muted">${p.client} · Owner ${p.owner}</div><div style="margin:10px 0 4px" class="muted">Phase: <b>${PHASES[p.phase]}</b></div><div class="steps">${PHASES.map((x,i)=>`<i class="${i<p.phase?'d':i==p.phase?'c':''}"></i>`).join('')}</div><div style="margin-top:10px">${p.jobs.length} jobs · ${$$(p.jobs.reduce((s,j)=>s+(j.act?sum(j.act):0),0))} spent of ${$$(p.jobs.reduce((s,j)=>s+(j.est?sum(j.est):0),0))} · ${p.jobs.filter(j=>['blocked','overdue','unassigned'].includes(j.st)).length?'<span class="tag r">Needs attention</span>':'<span class="tag g">On track</span>'}</div></a>`).join('')}</div>
<button class="btn" style="margin-top:16px" onclick="toast('New project form (mock)')">+ New project</button>`},
p(id){const p=P.find(x=>x.id==id);const T={
jobs:`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Small jobs inside this project</h2><button class="btn s" onclick="newReq('${id}')">+ New request</button></div>`+p.jobs.map((j,k)=>`<div class="row ${['blocked','overdue','unassigned'].includes(j.st)?'red':j.st=='done'?'grn':''}"><div class="grow"><div class="t">${j.n} <span class="tag">${j.trade}</span></div><div class="muted">Assignee: ${j.who} · Due ${j.due}${j.why?' · '+j.why:''}${j.est?` · <b style="color:${sum(j.act)>sum(j.est)?'#dc2626':'#374151'}">${$$(sum(j.act))} of ${$$(sum(j.est))}</b>`:''}</div>${bar(j.step)}</div>${stTag(j)}${j.est?`<button class="btn s l" onclick="addCost('${id}',${k})">+ Cost</button>`:''}<button class="btn s l" onclick="hand('${id}',${k})">Hand over</button><button class="btn s l hide-m" onclick="adv('${id}',${k})">Next step</button></div>`).join(''),
fin:(()=>{const js=p.jobs.filter(j=>j.est);let E=0,A=0,I=0,Pd=0;js.forEach(j=>{E+=sum(j.est);A+=sum(j.act);I+=j.inv;Pd+=j.paid});const co=p.id=='p1'?16000:p.id=='p2'?2000:0;const contract=Math.round(E*1.28)+co;
return `<h2>Project financials</h2><div class="grid g4"><div class="card"><div class="muted">Contract + change orders</div><div class="big">${$$(contract)}</div></div><div class="card"><div class="muted">Budget (cost)</div><div class="big">${$$(E)}</div></div><div class="card"><div class="muted">Spent so far</div><div class="big" style="color:${A>E?'#dc2626':'inherit'}">${$$(A)}</div></div><div class="card"><div class="muted">Profit so far (invoiced − cost)</div><div class="big" style="color:${I-A>=0?'#166534':'#dc2626'}">${$$(I-A)}</div></div></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="muted">Invoiced</div><div class="big" style="font-size:22px">${$$(I)}</div></div><div class="card"><div class="muted">Paid</div><div class="big" style="font-size:22px">${$$(Pd)}</div></div><div class="card"><div class="muted">Still owed on contract</div><div class="big" style="font-size:22px;color:#dc2626">${$$(contract-Pd)}</div></div></div>
<h2>By job: add cost → invoice it → profit</h2><table><tr><th>Job</th><th>Cost so far</th><th class="hide-m">Budget</th><th>Invoiced</th><th>Profit</th><th></th></tr>${p.jobs.map((j,k)=>{if(!j.est)return '';const a=sum(j.act),e=sum(j.est),pr=j.inv-a;return `<tr><td><b>${j.n}</b><div class="muted">${j.trade} · labor ${$$(j.act.lab)} · materials ${$$(j.act.mat)} · subs ${$$(j.act.sub)}</div></td><td><b style="color:${a>e?'#dc2626':'inherit'}">${$$(a)}</b>${a>e?' <span class="tag r">Over</span>':''}</td><td class="hide-m">${$$(e)}</td><td>${$$(j.inv)}</td><td><b style="color:${pr>=0?'#166534':'#dc2626'}">${$$(pr)}</b></td><td style="white-space:nowrap"><button class="btn s" onclick="addCost('${p.id}',${k})">+ Cost</button> <button class="btn s l" onclick="costs('${p.id}',${k})">All costs (${(COSTS[j.n]||[]).length})</button> <button class="btn s" onclick="invoice('${p.id}',${k})">Invoice</button> <button class="btn s l hide-m" onclick="mats('${j.n}')">Materials</button></td></tr>`}).join('')}</table>
<div class="muted" style="margin-top:8px">How it works: open Costs to see or add itemized lines (labor, materials, subs, qty × price, vendor) → Invoice bills the unbilled lines + your markup → the difference is your profit.</div>`})(),vault:vault(p),
money:`<h2>Estimate, invoices & change orders</h2><table><tr><th>Item</th><th>Type</th><th>Amount</th><th>Status</th></tr><tr><td>Base estimate (incl. demo, rough plumbing, framing, finishes)</td><td>Estimate</td><td>$184,500</td><td><span class="tag g">Approved</span></td></tr><tr><td>CO-03 Window upgrade</td><td>Change order</td><td>$6,200</td><td><span class="tag a">Waiting client</span></td></tr><tr><td>Powder room addition</td><td>Addition</td><td>$9,800</td><td><span class="tag">Estimating</span></td></tr><tr><td>INV-1042 Deposit 30%</td><td>Invoice</td><td>$55,350</td><td><span class="tag g">Paid</span></td></tr><tr><td>INV-1051 Progress #2</td><td>Invoice</td><td>$36,900</td><td><span class="tag r">Unpaid · 12 days</span></td></tr></table>`,
insp:`<h2>Inspections & materials</h2><div class="grid g2"><div><div class="row amb"><div class="grow"><div class="t">Framing inspection</div><div class="muted">Requested Nov 7 · Town of Monroe</div></div><span class="tag a">Waiting</span></div><div class="row grn"><div class="grow"><div class="t">Plumbing rough-in</div><div class="muted">Passed Nov 3</div></div><span class="tag g">Passed</span></div></div><div><div class="row red"><div class="grow"><div class="t">Andersen windows ×9</div><div class="muted">Supplier: ABC Supply</div></div><span class="tag r">Backorder</span></div><div class="row"><div class="grow"><div class="t">PEX + fittings</div><div class="muted">Delivered to site</div></div><span class="tag g">On site</span></div></div></div>`,
log:`<h2>Full history</h2><div class="muted" style="margin-bottom:10px">Anyone picking this project up sees everything that happened.</div><div class="log">${(HIST[id]||[]).map(h=>`<div><b>Today</b> · ${h}</div>`).join('')}<div><b>Nov 7</b> · Sara requested framing inspection</div><div><b>Nov 5</b> · Window job handed over: Dov → Sara ("Dov moved to Klein")</div><div><b>Nov 3</b> · Plumbing rough-in passed inspection</div><div><b>Oct 20</b> · Plans v3 uploaded by Rivky (Architect)</div><div><b>Sep 2</b> · Project opened · Owner Moshe K.</div></div>`};
return `<a class="muted" href="#projects">← Projects</a><h1>${p.name}</h1><div class="cap">${p.client} · ${p.addr} · <b>Owner: ${p.owner}</b> (stays owner through every handover)</div>
<div class="phases">${PHASES.map((x,i)=>`<div class="ph ${i<p.phase?'d':i==p.phase?'c':''}">${i<p.phase?'✓ ':''}${x}</div>`).join('')}</div>
<div class="tabs">${[['jobs','Jobs & tasks'],['fin','Financials'],['vault','Plans & docs'],['money','Estimate & invoices'],['insp','Inspections & materials'],['log','History']].map(([k,t])=>`<a class="${TAB==k?'on':''}" onclick="TAB='${k}';go()">${t}</a>`).join('')}</div>${T[TAB]}`},
costs(pid,k){k=+k;const p=P.find(x=>x.id==pid),j=p.jobs[k],L=COSTS[j.n]||[];const tot=L.reduce((s,c)=>s+c.amt,0),unb=L.filter(c=>!c.billed).reduce((s,c)=>s+c.amt,0),miss=L.filter(c=>!c.rc&&c.t!='lab').length;
const pv=PREV&&PREV.pid==pid&&PREV.k==k?`<div class="alert" style="display:block"><b>Preview: ${PREV.rows.length} lines from CSV · ${$$(PREV.rows.reduce((s,r)=>s+r.amt,0))}</b><table style="margin:10px 0"><tr><th>Date</th><th>Type</th><th>What</th><th>Qty × price</th><th>Amount</th><th>Vendor</th></tr>${PREV.rows.map(c=>`<tr><td>${c.d}</td><td><span class="tag">${TN[c.t]}</span></td><td>${c.w}</td><td>${c.qty} × ${$$(c.unit)}</td><td><b>${$$(c.amt)}</b></td><td>${c.v}</td></tr>`).join('')}</table><button class="btn" onclick="csvImport()">Import ${PREV.rows.length} lines</button> <button class="btn l" onclick="PREV=null;go()">Cancel</button></div>`:'';
return `<a class="muted" href="#p/${pid}/fin">← ${p.name} · Financials</a><h1>Costs · ${j.n}</h1><div class="cap">Every cost on this job, line by line, with its receipt. Quick-add one in a pop-up, or upload a CSV of many at once.</div>
<div class="grid g4"><div class="card"><div class="muted">Total cost</div><div class="big">${$$(tot)}</div></div><div class="card"><div class="muted">Budget</div><div class="big">${$$(sum(j.est))}</div></div><div class="card"><div class="muted">Not billed yet</div><div class="big" style="color:#b45309">${$$(unb)}</div></div><div class="card"><div class="muted">Missing receipts</div><div class="big" style="color:${miss?'#dc2626':'#166534'}">${miss}</div></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0"><button class="btn" onclick="addCost('${pid}',${k})">+ Add cost line</button><label class="btn l" style="cursor:pointer">⬆ Upload CSV<input type="file" accept=".csv,text/csv" style="display:none" onchange="csvPick('${pid}',${k},this)"></label><button class="btn l" onclick="csvSample('${pid}',${k})">Try sample CSV</button><button class="btn l" onclick="csvDownload()">⬇ CSV template</button><button class="btn" style="margin-left:auto" onclick="invoice('${pid}',${k})">Invoice unbilled (${$$(unb)})</button></div>${pv}
<table><tr><th>Date</th><th>Type</th><th>What</th><th>Qty × price</th><th>Amount</th><th class="hide-m">Vendor</th><th>Receipt</th><th>Billed</th></tr>${L.map((c,i)=>`<tr><td>${c.d}</td><td><span class="tag">${TN[c.t]}</span></td><td>${c.w}<div class="muted" style="font-size:12px">by ${c.by}</div></td><td>${c.qty} × ${$$(c.unit)}</td><td><b>${$$(c.amt)}</b></td><td class="hide-m">${c.v}</td><td>${c.rc?`<span class="tag b">📎 ${c.rc}</span>`:c.t=='lab'?'<span class="muted">—</span>':`<label class="tag r" style="cursor:pointer">Attach<input type="file" style="display:none" onchange="attach('${pid}',${k},${i},this)"></label>`}</td><td>${c.billed?'<span class="tag g">Billed</span>':'<span class="tag a">Not yet</span>'}</td></tr>`).join('')||'<tr><td colspan=8 class="muted">No costs yet</td></tr>'}</table>`},
mine(){const me='Sara (Office)';let r=[];P.forEach(p=>p.jobs.forEach((j,k)=>{if(j.who==me)r.push({p,j,k})}));return `<h1>My tasks</h1><div class="cap">Signed in as ${me}. Only what's on your plate, oldest due first.</div>${r.map(x=>`<div class="row ${x.j.st=='overdue'?'red':''}"><div class="grow"><div class="t">${x.j.n}</div><div class="muted">${x.p.name} · Owner ${x.p.owner} · Due ${x.j.due}</div>${bar(x.j.step)}</div>${stTag(x.j)}<button class="btn s l" onclick="hand('${x.p.id}',${x.k})">Hand over</button></div>`).join('')||'<div class="card">Nothing on your plate 🎉</div>'}`},
crews(){return `<h1>Crew schedule</h1><div class="cap">When a job gets stuck, JobFlow suggests moving the crew to their next job so nobody stands around.</div>
<div class="alert" id="sug"><div style="flex:1"><b>Framing on Goldberg is blocked</b> (waiting on inspection).<br>Move <b>Yossi's framing crew</b> to <b>Klein Duplex · Deck framing</b> tomorrow?</div><button class="btn" onclick="moveCrew()">Confirm move</button><button class="btn l" onclick="$('sug').remove()">Not now</button></div>
<table><tr><th>Crew</th><th>Mon</th><th>Tue</th><th>Wed</th><th class="hide-m">Thu</th><th class="hide-m">Fri</th></tr>
<tr><td><b>Yossi · Framing</b></td><td>Goldberg</td><td id="yt"><span class="tag r">Goldberg (blocked)</span></td><td id="yw">Goldberg</td><td class="hide-m">Klein</td><td class="hide-m">Klein</td></tr>
<tr><td><b>Avi · Plumbing</b></td><td>Goldberg</td><td>Goldberg</td><td>Weiss</td><td class="hide-m">Weiss</td><td class="hide-m">—</td></tr>
<tr><td><b>Roof crew B</b></td><td>Weiss</td><td><span class="tag r">Weiss (no material)</span></td><td>Weiss</td><td class="hide-m">—</td><td class="hide-m">—</td></tr>
<tr><td><b>Electric · Mendy</b></td><td>Klein</td><td>Klein</td><td>Goldberg</td><td class="hide-m">Goldberg</td><td class="hide-m">Goldberg</td></tr></table>`},
vault(){return `<h1>Vault</h1><div class="cap">Every plan and document from every project, with every version kept. Search anything.</div><input placeholder="Search plans, permits, contracts…" oninput="toast('Searching all projects (mock)')">`+vault(null)},
clients(){return `<h1>Clients</h1><div class="cap">Who they are, where, and what's paid or still owed.</div><table><tr><th>Client</th><th class="hide-m">Address</th><th>Projects</th><th>Paid</th><th>Owed</th></tr><tr><td><b>Goldberg Family</b></td><td class="hide-m">14 Forest Rd, Monroe</td><td>1</td><td>$55,350</td><td style="color:#dc2626;font-weight:700">$36,900</td></tr><tr><td><b>Weiss Properties</b></td><td class="hide-m">220 Main St, KJ</td><td>1</td><td>$42,000</td><td>$0</td></tr><tr><td><b>Klein Dev LLC</b></td><td class="hide-m">8 Satmar Dr, Monroe</td><td>1</td><td>$18,000</td><td style="color:#dc2626;font-weight:700">$12,500</td></tr></table>`},
crew(){return `<div style="max-width:390px;margin:0 auto"><h1>Today · Yossi</h1><div class="cap">What a crew member sees on their phone. Three buttons, nothing else.</div>
<div class="card" style="margin-bottom:12px"><div class="t" style="font-weight:800;font-size:18px">Goldberg Residence</div><div class="muted">14 Forest Rd, Monroe · 7:30 AM</div><div style="margin:8px 0">Second-floor framing</div><div style="display:grid;gap:8px"><button class="btn" onclick="toast('Arrival confirmed ✓')">✓ Confirm I'm on it</button><button class="btn l" onclick="block()">⚠ Mark blocked</button><button class="btn l" onclick="hand('p1',2)">⇄ Hand over</button></div></div>
<div class="card"><div class="t" style="font-weight:800">Next: Klein Duplex</div><div class="muted">Wed · Deck framing</div></div></div>`}};
function vault(p){const F=[['Plans & drawings','A-101 Floor plan','v3',"Rivky (Architect)",'Team + Client'],['Plans & drawings','S-201 Framing plan','v2','Dov (Engineer)','Team'],['Permits','Building permit #22-418','v1','Sara (Office)','Owner + Team'],['Contracts','Signed contract','v1','Moshe K.','Owner'],['Inspections','Plumbing rough-in report','v1','Avi','Team'],['Photos','Site photos — Nov 7 (24)','—','Yossi','Team + Client'],['Warranty','Roof warranty certificate','v1','Sara (Office)','Client']];
return `<h2>${p?'Plans & docs':'All files'}</h2><table><tr><th>Folder</th><th>File</th><th>Version</th><th class="hide-m">Uploaded by</th><th class="hide-m">Who can see</th></tr>${F.map(f=>`<tr><td>${f[0]}</td><td><b>${f[1]}</b></td><td>${f[2]!='—'?`<span class="tag b" style="cursor:pointer" onclick="vers('${f[1]}','${f[2]}')">${f[2]} current</span>`:'—'}</td><td class="hide-m">${f[3]}</td><td class="hide-m">${f[4]}</td></tr>`).join('')}</table><button class="btn l" style="margin-top:12px" onclick="toast('Upload (mock)')">⬆ Upload file</button>`}
function addCost(pid,k){const j=P.find(x=>x.id==pid).jobs[k];$('mb').innerHTML=`<h2 style="margin-top:0">Add cost line</h2><div class="muted">${j.n}</div><label>Type</label><select id="ct"><option value="mat">Materials</option><option value="lab">Labor</option><option value="sub">Subcontractor</option></select><label>What</label><input id="cd" placeholder="e.g. Drywall 1/2&quot; sheets"><div class="grid g2"><div><label>Qty / hours</label><input id="cq" type="number" value="1"></div><div><label>Unit price ($)</label><input id="cu" type="number" placeholder="0"></div></div><label>Vendor / who</label><input id="cv" placeholder="e.g. Home Depot Pro"><button class="btn" onclick="doCost('${pid}',${k})">Add cost</button> <button class="btn l" onclick="doCost('${pid}',${k},1)">Add & enter another</button> <button class="btn l" onclick="cl()">Cancel</button><div class="muted" style="margin-top:10px">Many lines? Use <b>Upload CSV</b> on the job's All costs page.</div>`;$('md').classList.add('on')}
function doCost(pid,k,again){const j=P.find(x=>x.id==pid).jobs[k],t=$('ct').value,q=+$('cq').value||1,u=+$('cu').value||0,w=$('cd').value||TN[t],v=$('cv').value||'—';if(!u){toast('Enter a unit price');return}const amt=Math.round(q*u);(COSTS[j.n]=COSTS[j.n]||[]).push({d:'Today',t,w,qty:String(q),unit:u,amt,v,by:'Sara (Office)',billed:false});syncAct(j);if(t=='mat'){(MATS[j.n]=MATS[j.n]||[]).push([w,v,q,$$(amt),'Delivered'])}(HIST[pid]=HIST[pid]||[]).unshift(`Cost added to ${j.n}: ${w} ${q} × ${$$(u)} = ${$$(amt)}`);toast('Cost added ✓');go();if(again){addCost(pid,k)}else cl()}
function invoice(pid,k){const j=P.find(x=>x.id==pid).jobs[k],L=(COSTS[j.n]||[]).filter(c=>!c.billed),un=L.reduce((s,c)=>s+c.amt,0);window._inv={pid,k};
$('mb').innerHTML=`<h2 style="margin-top:0">Invoice client</h2><div class="muted" style="margin-bottom:10px">${j.n} · unbilled cost lines</div>${L.length?`<table><tr><th>What</th><th>Qty × price</th><th>Cost</th></tr>${L.map(c=>`<tr><td>${c.w} <span class="tag">${TN[c.t]}</span></td><td>${c.qty} × ${$$(c.unit)}</td><td>${$$(c.amt)}</td></tr>`).join('')}</table>`:'<div class="card">Nothing unbilled. Add costs first.</div>'}
<div class="row" style="margin-top:10px"><div class="grow">Total cost to bill</div><b>${$$(un)}</b></div><label>Markup %</label><input id="mk" type="number" value="25" oninput="calcInv(${un})"><div class="row"><div class="grow">Invoice amount</div><b id="ia">${$$(un*1.25)}</b></div><div class="row grn"><div class="grow">Your profit on this invoice</div><b id="ip" style="color:#166534">${$$(un*.25)}</b></div><button class="btn" onclick="doInv(${un})">Create & send invoice</button> <button class="btn l" onclick="cl()">Cancel</button>`;$('md').classList.add('on')}
function calcInv(un){const m=(+$('mk').value||0)/100;$('ia').textContent=$$(un*(1+m));$('ip').textContent=$$(un*m)}
function doInv(un){const {pid,k}=window._inv,j=P.find(x=>x.id==pid).jobs[k],m=(+$('mk').value||0)/100,amt=Math.round(un*(1+m));if(!amt){toast('Nothing to invoice yet');return}(COSTS[j.n]||[]).forEach(c=>c.billed=true);j.inv+=amt;(HIST[pid]=HIST[pid]||[]).unshift(`Invoice sent for ${j.n}: ${$$(amt)} (itemized cost ${$$(un)} + ${Math.round(m*100)}% markup)`);cl();toast('Invoice '+$$(amt)+' sent ✓');go()}
function mats(n){const m=MATS[n]||[];$('mb').innerHTML=`<h2 style="margin-top:0">Materials</h2><div class="muted" style="margin-bottom:10px">${n}</div>${m.length?m.map(x=>`<div class="row ${x[4]=='Backorder'?'red':''}"><div class="grow"><div class="t">${x[0]}</div><div class="muted">${x[1]} · qty ${x[2]}</div></div><b>${x[3]}</b><span class="tag ${x[4]=='Delivered'?'g':x[4]=='Backorder'?'r':'a'}">${x[4]}</span></div>`).join(''):'<div class="card">No materials on this job yet.</div>'}<button class="btn l" onclick="toast('Add material (mock)')">+ Add material</button> <button class="btn" onclick="cl()">Close</button>`;$('md').classList.add('on')}
function vers(n,v){const k=+v.slice(1);let h='';for(let i=k;i>=1;i--)h+=`<div class="row"><div class="grow"><b>v${i}</b>${i==k?' <span class="tag g">Current</span>':''}<div class="muted">${['Oct 20','Sep 30','Sep 12'][k-i]||'Sep 1'} · ${i==k?'Rivky':'Dov'}</div></div><button class="btn s l" onclick="toast('Opening v${i} (mock)')">Open</button></div>`;
$('mb').innerHTML=`<h2 style="margin-top:0">${n}</h2><div class="muted" style="margin-bottom:10px">Every version is kept. Nothing is ever overwritten.</div>${h}<button class="btn" onclick="cl()">Close</button>`;$('md').classList.add('on')}
function hand(pid,k){const p=P.find(x=>x.id==pid),j=p.jobs[k];$('mb').innerHTML=`<h2 style="margin-top:0">Hand over</h2><div class="muted">${j.n}</div><p>From <b>${j.who}</b> → to</p><select id="to"><option>Avi (Plumbing crew)</option><option>Sara (Office)</option><option>Dov (Engineer)</option><option>Mendy (Electric)</option></select><textarea id="nt" rows="2" placeholder="Handover note (what's done, what's next)"></textarea><div class="muted" style="margin-bottom:12px">Project owner stays <b>${p.owner}</b>.</div><button class="btn" onclick="doHand('${pid}',${k})">Hand over</button> <button class="btn l" onclick="cl()">Cancel</button>`;$('md').classList.add('on')}
function doHand(pid,k){const p=P.find(x=>x.id==pid),j=p.jobs[k],to=$('to').value,nt=$('nt').value||'no note';(HIST[pid]=HIST[pid]||[]).unshift(`${j.n} handed over: ${j.who} → ${to} ("${nt}")`);j.who=to;if(j.st=='unassigned')j.st='ok';cl();toast('Handed over to '+to+' ✓');go()}
function adv(pid,k){const j=P.find(x=>x.id==pid).jobs[k];if(j.step<7){j.step++;(HIST[pid]=HIST[pid]||[]).unshift(`${j.n} moved to ${STEPS[j.step]}`);if(j.step==7)j.st='done';toast('Moved to '+STEPS[j.step]);go()}}
function newReq(pid){const p=P.find(x=>x.id==pid);p.jobs.unshift({n:'New client request',trade:'TBD',step:0,who:'Unassigned',due:'—',st:'unassigned'});(HIST[pid]=HIST[pid]||[]).unshift('New client request logged');toast('Request added at step 1');go()}
function moveCrew(){$('yw').innerHTML='<span class="tag b">Klein · Deck framing</span>';$('sug').outerHTML='<div class="alert" style="background:#ecfdf5;border-color:#86efac"><b>✓ Done.</b> Yossi\'s crew confirmed the move. Goldberg framing stays flagged until the inspection passes.</div>';toast('Crew moved ✓')}
function block(){const j=P[0].jobs[2];j.st='blocked';toast('Marked blocked. Owner notified.')}
function cl(){$('md').classList.remove('on')}
$('md').onclick=e=>{if(e.target.id=='md')cl()};

P.forEach(p=>p.jobs.forEach(j=>{if(!j.est)return;const s=SEED[j.n]||[];COSTS[j.n]=s.map(x=>{const q=parseFloat(x[3])||1;return{d:x[0],t:x[1],w:x[2],qty:x[3],unit:x[4],amt:Math.round(q*x[4]),v:x[5],by:x[6],billed:j.paid>0,rc:x[1]=='lab'?null:(x[4]>500||x[1]=='sub'?(x[5].split(' ')[0]+'-inv.pdf'):null)}});syncAct(j);}));
function costs(pid,k){location.hash='#costs/'+pid+'/'+k}
function parseCSV(t){const rows=t.trim().split(/\r?\n/).map(l=>{const o=[];let c='',q=false;for(const ch of l){if(ch=='"'){q=!q}else if(ch==','&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o});const h=rows[0].map(x=>x.toLowerCase());const ix=n=>h.findIndex(x=>x.includes(n));const iD=ix('date'),iT=ix('type'),iW=ix('desc')>=0?ix('desc'):ix('what'),iQ=ix('qty'),iU=ix('price'),iV=ix('vendor');
return rows.slice(1).filter(r=>r.length>1).map(r=>{const tt=(r[iT]||'').toLowerCase();const t=tt.startsWith('lab')?'lab':tt.startsWith('sub')?'sub':'mat';const q=parseFloat(r[iQ])||1,u=parseFloat((r[iU]||'0').replace(/[$,]/g,''))||0;return{d:r[iD]||'Today',t,w:r[iW]||TN[t],qty:String(q),unit:u,amt:Math.round(q*u),v:r[iV]||'—',by:'CSV import',billed:false,rc:null}})}
let PREV=null;
function csvPick(pid,k,inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{PREV={pid,k,rows:parseCSV(rd.result)};go()};rd.readAsText(f)}
function csvSample(pid,k){PREV={pid,k,rows:parseCSV(SAMPLE)};go()}
function csvImport(){const {pid,k,rows}=PREV,j=P.find(x=>x.id==pid).jobs[k];(COSTS[j.n]=COSTS[j.n]||[]).push(...rows);syncAct(j);rows.filter(r=>r.t=='mat').forEach(r=>(MATS[j.n]=MATS[j.n]||[]).push([r.w,r.v,r.qty,$$(r.amt),'Delivered']));(HIST[pid]=HIST[pid]||[]).unshift(`${rows.length} cost lines imported from CSV into ${j.n} (${$$(rows.reduce((s,r)=>s+r.amt,0))})`);PREV=null;toast(rows.length+' lines imported ✓');go()}
function csvDownload(){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(SAMPLE);a.download='jobflow-costs-template.csv';a.click()}
function attach(pid,k,i,inp){const j=P.find(x=>x.id==pid).jobs[k],c=COSTS[j.n][i];c.rc=inp.files[0]?inp.files[0].name:'receipt.pdf';(HIST[pid]=HIST[pid]||[]).unshift(`Receipt attached to "${c.w}": ${c.rc}`);toast('Receipt attached ✓');go()}
const SAMPLE=`Date,Type,Description,Qty,Unit price,Vendor
Nov 10,Materials,Drywall 1/2in sheets,40,14.5,Home Depot Pro
Nov 10,Materials,Joint compound 5gal,6,22,Home Depot Pro
Nov 10,Labor,Drywall crew hours,24,55,In-house
Nov 11,Sub,Electrician rough-in,1,3200,Mendy Electric`;
function go(){const h=(location.hash||'#dash').slice(1).split('/');const v=h[0];if(v=='p'&&h[2])TAB=h[2];nav(v=='p'||v=='costs'?'projects':v);$('m').innerHTML=(V[v]||V.dash)(h[1],h[2]);}
window.onhashchange=()=>{TAB='jobs';go();$('m').scrollTop=0};go();
</script></body></html>
